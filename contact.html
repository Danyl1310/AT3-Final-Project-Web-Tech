<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="fontawesome" href="./Assets/fonts/Font Awesome/css/fontawesome.min.css">
    <script src="./Assets/js/script.js" defer></script>
    <link rel="stylesheet" href="./src/output.css">
    <title>Dashboard</title>
</head>
<body class="bg-slate-grey">
    <header class="sticky top-0 flex flex-col justify-between p-6 mx-auto md:flex-row gap-6 bg-shadow-grey text-frozen-lake border-b-1 border-frozen-lake">
        <a href="./index.html" class="flex items-center mb-4 md:mb-0 gap-6">
            <img rel="logo" src="https://placehold.co/50x50">
            <h1 class="text-xl hover:text-parchment transition ease-in-out">Cert IV Web Dev Portfolio</h1>
        </a>
        <nav class="flex gap-8 px-8">
            <div class="relative inline-block">
                <button id="menuBtn" class="bg-graphite text-parchment px-4 py-4 w-45 border-2 border-charcoal hover:text-emerald hover:border-frozen-lake rounded-sm text-left">
                    Menu
                </button>
                <ul id="menu" class="absolute top-full bg-slate-grey right-0 w-45 hidden">
                    <li class="block px-4 py-3 shadow">
                        <a href="./index.html" class="text-parchment hover:text-frozen-lake">Dashboard</a>
                    </li>
                    <li class="block px-4 py-3 shadow">
                        <a href="./mywork.html" class="text-parchment hover:text-frozen-lake">My Work</a>
                    </li>
                    <li class="block px-4 py-3 shadow">
                        <a href="./resume.html" class="text-parchment hover:text-frozen-lake">Resume</a>
                    </li>
                    <li class="block px-4 py-3 shadow">
                        <a href="./contact.html" class="text-parchment hover:text-frozen-lake">Contact</a>
                    </li>
                </ul>
            </div>
            <a href="./about.html" class="bg-graphite inline-flex items-center text-parchment px-8 border-2 border-charcoal hover:text-emerald hover:border-frozen-lake rounded-sm">About</a>
        </nav>
    </header>
    <main class="bg-charcoal text-parchment w-5/6 mx-auto min-h-screen p-6 border-x-2 border-shadow-grey">
        <article class="block px-4 shadow-xl gap-2 bg-graphite p-4">
            <h2 class="text-2xl md:mb-8 text-frozen-lake p-2">Contact Us</h2>
            <form class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-4 px-20">
                <p class="text-xl text-parchment">First-name:</p>
                <input type="text" class="rounded-md border border-slate-grey bg-charcoal px-3 py-2 
                text-parchment placeholder-slate-grey focus:border-frozen-lake focus:ring-1 focus:ring-frozen-lake">
                <p class="text-xl text-parchment">Last-name:</p>
                <input type="text" class="rounded-md border border-slate-grey bg-charcoal px-3 py-2 
                text-parchment placeholder-slate-grey focus:border-frozen-lake focus:ring-1 focus:ring-frozen-lake">
                <p class="text-xl text-parchment">Email:</p>
                <input type="email" class="rounded-md border border-slate-grey bg-charcoal px-3 py-2 
                text-parchment placeholder-slate-grey focus:border-frozen-lake focus:ring-1 focus:ring-frozen-lake">
                <p class="text-xl text-parchment">Message:</p>
                <textarea class="min-h-40 rounded-md border border-slate-grey bg-charcoal px-3 py-2 
                text-parchment placeholder-slate-grey focus:border-frozen-lake focus:ring-1 focus:ring-frozen-lake">

                </textarea>
                <div class="col-start-2 flex justify-end gap-4">
                    <button class="inline-block text-parchment rounded-xs border border-slate-grey bg-charcoal 
                    px-10 py-2 hover:text-emerald hover:border-frozen-lake">Send</button>
                    <button class="inline-block text-parchment rounded-xs border border-slate-grey bg-charcoal 
                    px-10 py-2 hover:text-emerald hover:border-frozen-lake">Cancel</button>
                </div>
            </form>
        </article>
    </main>
    <footer class="bottom-0 flex flex-cols p-6 justify-between mx-auto md:flex-row gap-6 bg-shadow-grey text-frozen-lake items-center w-full">
        <h4 class="text-sm hover:text-black transition ease-in-out">© 2026 Daniel Cummings, All rights reserved.</h4>
        <button id="toTop" class="bg-graphite text-parchment px-4 py-1 border-2 border-charcoal rounded-lg hover:text-emerald hover:border-frozen-lake justify-self-center -translate-x-14">Top ^</button>
        <nav class="flex items-center justify-self-end gap-8 px-8">
            <a class="hover:text-parchment transition ease-in-out" href="./copyright.html">Copyright</a>
            <p>|</p>
            <a class="hover:text-parchment transition ease-in-out" href="./contact.html">Contact</a>
        </nav>
    </footer>
</body>
</html>
